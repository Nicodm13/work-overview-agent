import org.gradle.process.ExecOperations

plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
}

group = 'dk.school.workoverview'
version = '0.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(26)
        vendor = JvmVendorSpec.ADOPTIUM
    }
}

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.1.1')
    implementation platform('org.springframework.ai:spring-ai-bom:2.0.1')
    implementation 'org.springframework.ai:spring-ai-starter-mcp-server-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'com.microsoft.graph:microsoft-graph:6.70.0'
    implementation 'com.azure:azure-identity:1.18.6'
    implementation 'org.jsoup:jsoup:1.23.2'
    implementation 'org.apache.poi:poi-ooxml:5.5.1'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation platform('org.springframework.boot:spring-boot-dependencies:4.1.1')
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'io.cucumber:cucumber-java:7.18.1'
    testImplementation 'io.cucumber:cucumber-spring:7.18.1'
    testImplementation 'io.cucumber:cucumber-junit-platform-engine:7.18.1'
    testImplementation 'org.junit.platform:junit-platform-suite'
    testImplementation 'org.testcontainers:junit-jupiter:1.20.6'
    testImplementation 'org.testcontainers:postgresql:1.20.6'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.register('authenticationTest', Test) {
    group = 'verification'
    description = 'Runs local HTTP JWT and tenant-scoping tests without Docker.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include 'dk/school/workoverviewagent/config/McpSecurityHttpTest.class'
    include 'dk/school/workoverviewagent/config/McpAuthenticatedToolHttpTest.class'
    include 'dk/school/workoverviewagent/graph/GraphAccessTokenProviderTest.class'
    include 'dk/school/workoverviewagent/user/UserProviderTest.class'
    useJUnitPlatform()
}

tasks.register('bootRunGraph', org.springframework.boot.gradle.tasks.run.BootRun) {
    group = 'application'
    description = 'Runs the MCP server with live Microsoft Graph source adapters.'
    mainClass = 'dk.school.workoverviewagent.Application'
    classpath = sourceSets.main.runtimeClasspath
    systemProperty 'work-overview.sources.provider', 'graph'
}

tasks.register('bootRunMocked', org.springframework.boot.gradle.tasks.run.BootRun) {
    group = 'application'
    description = 'Runs the MCP server with deterministic mocked source data.'
    mainClass = 'dk.school.workoverviewagent.Application'
    classpath = sourceSets.main.runtimeClasspath
    systemProperty 'work-overview.sources.provider', 'mock'
}

def graphTestDataSeedScript = layout.projectDirectory.file('scripts/seed-graph-test-data.ps1').asFile.absolutePath
def graphTestDataCleanupScript = layout.projectDirectory.file('scripts/remove-graph-test-data.ps1').asFile.absolutePath

tasks.register('seedGraphTestData', Exec) {
    group = 'microsoft 365 test data'
    description = 'Seeds Microsoft Graph test data and sends dataset emails and meeting invitations to the sandbox.'
    commandLine 'powershell.exe', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', graphTestDataSeedScript,
        '-ConfirmSandboxTenant'
}

tasks.register('clearGraphTestData', Exec) {
    group = 'microsoft 365 test data'
    description = 'Deletes mailbox and calendar items and purges Teams messages while preserving accounts and conversation containers. Use -PskipTeamsMessagePurge=true to skip an already completed Teams purge.'
    def cleanupArgs = [
        '-Apply', '-RemoveAllMailboxAndCalendarItems', '-ConfirmCalendarCancellations',
        '-PurgeAllTeamsMessages', '-ConfirmPermanentTeamsPurge', '-ConfirmSandboxTenant'
    ]
    if (project.hasProperty('skipTeamsMessagePurge')) cleanupArgs << '-SkipTeamsMessagePurge'
    commandLine(['powershell.exe', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', graphTestDataCleanupScript] + cleanupArgs)
}

def composeFile = layout.projectDirectory.file('compose.yaml').asFile.absolutePath

tasks.register('dockerStartDatabase', Exec) {
    group = 'docker'
    description = 'Starts PostgreSQL and applies Flyway migrations.'
    commandLine 'docker', 'compose', '-f', composeFile, 'up', '--detach', 'postgres'
}

def execOperations = services.get(ExecOperations)

tasks.register('dockerMigrateDatabase', Exec) {
    group = 'docker'
    description = 'Applies the Flyway migrations to the local PostgreSQL database.'
    commandLine 'docker', 'compose', '-f', composeFile, 'run', '--rm', '--build', 'flyway'
}

tasks.named('dockerStartDatabase') {
    finalizedBy tasks.named('dockerMigrateDatabase')
}

tasks.register('dockerResetDatabase') {
    group = 'docker'
    description = 'Deletes local database data, starts PostgreSQL, and applies Flyway migrations.'

    doLast {
        execOperations.exec {
            commandLine 'docker', 'compose', '-f', composeFile, 'down', '--volumes'
        }
        execOperations.exec {
            commandLine 'docker', 'compose', '-f', composeFile, 'up', '--detach', 'postgres'
        }
        execOperations.exec {
            commandLine 'docker', 'compose', '-f', composeFile, 'run', '--rm', '--build', 'flyway'
        }
    }
}

tasks.register('dockerDeleteDatabase', Exec) {
    group = 'docker'
    description = 'Stops the local PostgreSQL database container and deletes its data volume.'
    commandLine 'docker', 'compose', '-f', composeFile, 'down', '--volumes'
}
