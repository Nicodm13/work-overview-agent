spring:
    application:
        name: work-overview-agent

    config:
        import:
            - optional:file:./.env[.properties]
            - optional:file:./server/.env[.properties]

    ai:
        mcp:
            server:
                name: work-overview-agent
                version: 0.1.0
                type: SYNC
                protocol: STREAMABLE
                instructions: >-
                    For work reviews, use the returned evidence to interpret and prioritize findings. Resolve references
                    to the signed-in user as "you" when the evidence identifies that person; never tell the user to
                    contact themselves about work assigned to them. For every finding with a concrete, evidence-based
                    external follow-up, prepare an editable draft by calling draft_follow_up_action before presenting
                    the final overview. Use the original communication channel and a recipient explicitly supported by
                    evidence. Do not silently omit a suitable draft. If a recipient, channel, or material content is
                    uncertain, do not invent it; explain the uncertainty or ask the user for the missing detail.
                    Use find_contacts to resolve a named recipient to their tenant email address and Graph identity
                    before drafting; if multiple contacts match, ask the user to choose.
                    Drafting only stores editable content and never sends or schedules anything. Never approve or
                    execute a draft without first showing the exact recipients and content and obtaining the user's
                    explicit final approval for that draft. Call approve_action_draft only after that approval, then
                    execute using the returned approval reference. Report ACCEPTED_BY_GRAPH as accepted by Graph,
                    SIMULATED as mock-only, OUTCOME_UNKNOWN as requiring source verification, and FAILED as rejected;
                    never describe an attempted, unknown, or simulated action as sent or scheduled.
                annotation-scanner:
                    enabled: true

    datasource:
        url: ${WORK_OVERVIEW_DATABASE_URL:jdbc:postgresql://localhost:5432/work_overview_agent}
        username: ${WORK_OVERVIEW_DATABASE_USERNAME:work_overview_agent}
        password: ${WORK_OVERVIEW_DATABASE_PASSWORD:work_overview_agent}

    flyway:
        enabled: true

work-overview:
    sources:
        provider: graph
    security:
        enabled: ${WORK_OVERVIEW_SECURITY_ENABLED:true}
        issuer-uri: ${WORK_OVERVIEW_ENTRA_ISSUER_URI:}
        audience: ${WORK_OVERVIEW_ENTRA_AUDIENCE:}
        scope: ${WORK_OVERVIEW_ENTRA_SCOPE:}
        tenant-id: ${WORK_OVERVIEW_ENTRA_TENANT_ID:}
        resource-uri: ${WORK_OVERVIEW_MCP_RESOURCE_URI:}

    graph:
        authentication:
            client-id: ${WORK_OVERVIEW_ENTRA_CLIENT_ID:}
            client-secret: ${WORK_OVERVIEW_ENTRA_CLIENT_SECRET:}
            certificate-path: ${WORK_OVERVIEW_ENTRA_CERTIFICATE_PATH:}
            certificate-password: ${WORK_OVERVIEW_ENTRA_CERTIFICATE_PASSWORD:}

server:
    port: ${SERVER_PORT:8080}
    address: ${SERVER_ADDRESS:127.0.0.1}
    ssl:
        enabled: ${WORK_OVERVIEW_SERVER_SSL_ENABLED:false}
        key-store: ${WORK_OVERVIEW_SERVER_SSL_KEY_STORE:}
        key-store-password: ${WORK_OVERVIEW_SERVER_SSL_KEY_STORE_PASSWORD:}
        key-store-type: PKCS12
