name: Pull request checks

on:
    pull_request:
        branches:
            - main
            - dev
        types:
            - opened
            - reopened
            - synchronize
            - ready_for_review
    pull_request_target:
        branches:
            - main
            - dev
        types:
            - opened
            - reopened
            - synchronize
            - ready_for_review
    pull_request_review:
        branches:
            - main
            - dev
        types:
            - submitted

permissions:
    contents: read
    pull-requests: read
    statuses: write

concurrency:
    group: pr-review-${{ github.event.pull_request.number }}
    cancel-in-progress: false

jobs:
    build:
        name: build
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout
                uses: actions/checkout@v5

            -   name: Set up Java
                uses: actions/setup-java@v5
                with:
                    distribution: temurin
                    java-version: '26'
                    cache: gradle

            -   name: Validate Gradle wrapper
                uses: gradle/actions/wrapper-validation@v4

            -   name: Build
                run: |
                    chmod +x ./gradlew
                    ./gradlew --no-daemon build --warning-mode all

    require-codex-review:
        name: require-codex-review
        if: github.event_name == 'pull_request_target'
        runs-on: ubuntu-latest

        steps:
            -   name: Mark the pull request commit as awaiting Codex review
                uses: actions/github-script@v7
                with:
                    github-token: ${{ github.token }}
                    script: |
                        const { owner, repo } = context.repo;
                        const sha = context.payload.pull_request.head.sha;

                        await github.rest.repos.createCommitStatus({
                            owner,
                            repo,
                            sha,
                            state: 'pending',
                            context: 'codex-review-completed',
                            description: 'Waiting for connected Codex Code Review.',
                            target_url: `https://github.com/${owner}/${repo}/pull/${context.payload.pull_request.number}`,
                        });

    confirm-codex-review:
        name: confirm-codex-review
        if: github.event_name == 'pull_request_review' && github.event.review.user.login == 'chatgpt-codex-connector[bot]'
        runs-on: ubuntu-latest

        steps:
            -   name: Mark the reviewed commit as complete
                uses: actions/github-script@v7
                with:
                    github-token: ${{ github.token }}
                    script: |
                        const { owner, repo } = context.repo;
                        const pullRequest = context.payload.pull_request;
                        const review = context.payload.review;
                        const { data: currentPullRequest } = await github.rest.pulls.get({
                            owner,
                            repo,
                            pull_number: pullRequest.number,
                        });

                        if (review.commit_id !== currentPullRequest.head.sha) {
                            core.notice('Codex reviewed an older commit; the current commit remains pending review.');
                            return;
                        }

                        await github.rest.repos.createCommitStatus({
                            owner,
                            repo,
                            sha: currentPullRequest.head.sha,
                            state: 'success',
                            context: 'codex-review-completed',
                            description: 'Connected Codex Code Review completed for this commit.',
                            target_url: review.html_url,
                        });
